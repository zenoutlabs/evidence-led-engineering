[project]
name = "evidence-led-engineering-mcp"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "Local timing-evidence review tools for AI coding agents"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0", "pydantic==2.14.2"]

[project.scripts]
evidence-led-engineering-mcp = "evidence_led_engineering_mcp.server:main"

[build-system]
requires = ["uv_build==0.11.21"]
build-backend = "uv_build"
